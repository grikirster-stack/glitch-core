name: CI

# Прогон автотестов логики на каждом пуше и PR.
# Godot ставится той же версии, что и у разработчиков (4.7.2-stable),
# напрямую из официальных релизов godotengine — без сторонних actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  tests:
    name: Автотесты логики
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Скачать Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "$url" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # ВАЖНО: без этого шага class_name-классы (Player, IDs, Phantom, ...)
      # не регистрируются в свежем чекауте — .godot/global_script_class_cache.cfg
      # не в git. Скрипты не грузятся, тест-раннер не стартует, процесс висит.
      - name: Импорт проекта (регистрация class_name)
        timeout-minutes: 5
        run: godot --headless --path . --import

      - name: Автотесты (сид 31337)
        timeout-minutes: 5
        run: godot --headless --path . -- --test --seed=31337

      - name: Автотесты (сид 4242)
        timeout-minutes: 5
        run: godot --headless --path . -- --test --seed=4242

      - name: Автотесты (сид 12345)
        timeout-minutes: 5
        run: godot --headless --path . -- --test --seed=12345

      # Автотест анимаций отдельным запуском: он умеет работать и сам по себе
      # (--script), без флага --test. Шаг ловит, что отдельная точка входа
      # не разъехалась с общим прогоном.
      - name: Автотест анимаций (отдельный запуск)
        timeout-minutes: 5
        run: godot --headless --path . --script res://tools/anim_test.gd -- --seed=31337

      # Регрессии индекса питания (issue #11) — отдельным запуском.
      - name: Автотест индекса питания (отдельный запуск)
        timeout-minutes: 5
        run: godot --headless --path . --script res://tools/power_test.gd -- --seed=31337

      # Генеративный лор (issue #26) — отдельным запуском: проверяет те же 100 сидов,
      # что и секция «== Лор ==» общего прогона, и ловит расхождение точек входа.
      - name: Автотест лора (отдельный запуск)
        timeout-minutes: 5
        run: godot --headless --path . --script res://tools/lore_test.gd

      # Текст лора для чтения глазами на ревью. Заодно проверяет, что флаг
      # --lore-dump печатает журнал и выходит с нулевым кодом.
      - name: Печать лора для ревью (сиды 31337, 4242, 12345)
        timeout-minutes: 5
        run: |
          for s in 31337 4242 12345; do
            godot --headless --path . -- --lore-dump --seed=$s
          done

      # Сторож фризов. Шаг роняет сборку при «жёстком» фризе — кадре длиннее
      # 500 мс: это настоящее зависание, а не шум планировщика (локально худший
      # кадр 12–57 мс, запас 10–40x). Мягкие фризы (> 100 мс) не роняют шаг,
      # но остаются в артефакте freeze-report.
      - name: Сторож фризов (headless)
        timeout-minutes: 10
        run: godot --headless --path . --script res://tools/freeze_probe.gd -- --seed=31337

      - name: Отчёт о фризах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-report
          path: .tools/freeze_report.txt
          if-no-files-found: ignore
